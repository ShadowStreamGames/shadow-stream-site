<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stranger In A Stranger Land – Shadow Stream Games</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background: #0f0f0f;
      color: #fff;
      line-height: 1.6;
    }

    header {
      width: 100%;
      height: 40vh;
      min-height: 220px;
      background-image: url('../SSG_Header.png');
      background-size: cover;
      background-position: center;
    }

    section {
      background: rgba(20,20,20,0.7);
      max-width: 900px;
      margin: 40px auto;
      padding: 40px 20px;
      border-radius: 12px;
    }

    section h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    section h2 {
      margin-top: 30px;
      color: #eaeaea;
    }

    .image-row {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 20px;
    }

    .image-row img {
      max-width: 30%;
      border-radius: 8px;
    }

    @media (max-width: 768px) {
      .image-row {
        flex-direction: column;
        align-items: center;
      }

      .image-row img {
        max-width: 80%;
      }
    }
  </style>
</head>

<body>

  <header></header>

  <section>
    <p><a href="/">← Back to Home</a></p>

    <h1>Stranger In A Stranger Land</h1>

    <p>Mystery visual novel in development.</p>

    <h2>Overview</h2>
    <p>
      Stranger In A Strange Land is the tale of a young hero who finds himself in a foreign land far from home. He wants to be there but he has a LOT to learn about the locals and their customs.
    </p>

    <h2>Characters</h2>
    <div class="image-row">
      <img src="../images/tsubaki_sprite.png" alt="Tsubaki">
      <img src="../images/protagonist_sprite.png" alt="Protagonist">
      <img src="../images/miyuki_sprite.png" alt="Miyuki">
    </div>

  </section>

</body>
</html>
